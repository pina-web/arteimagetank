<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPEAK BRAWL — 영어 배틀</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root{
  --navy:#1B1F3B; --navy2:#252B54; --deep:#12152E;
  --yellow:#FFC93C; --orange:#FF8A00; --red:#FF3B5C;
  --blue:#00C2FF; --purple:#A64DFF; --green:#3DDC5C;
  --pink:#FF5FA2; --text:#FFFFFF; --sub:#9BA3D0;
}
body{ background:var(--deep); font-family:'Pretendard',-apple-system,system-ui,sans-serif;
  color:var(--text); display:flex; justify-content:center; min-height:100vh; overflow-x:hidden; }
#app{ width:100%; max-width:440px; min-height:100vh; padding:14px 14px 40px; position:relative;
  background:radial-gradient(circle at 50% 0%, #2A2F5E 0%, #12152E 60%); }
button{ font-family:inherit; cursor:pointer; border:none; }
button:active{ transform:scale(.95) translateY(2px); }
button:disabled{ cursor:default; }

/* ===== 브롤 공통: 두꺼운 테두리 + 하단 그림자 (3D 버튼) ===== */
.brawl{ border:3px solid rgba(0,0,0,.45); border-radius:16px;
  box-shadow:0 5px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.25); }
.stroke{ -webkit-text-stroke:2px rgba(0,0,0,.6); paint-order:stroke fill; }

@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes glow{0%,100%{box-shadow:0 0 12px rgba(255,201,60,.5)}50%{box-shadow:0 0 26px rgba(255,201,60,.95)}}
@keyframes coinUp{0%{transform:translateY(0) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-110px) scale(1.2);opacity:0}}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.8);opacity:0}}
@keyframes conf{0%{transform:translateY(-50px) rotate(0);opacity:1}100%{transform:translateY(420px) rotate(720deg);opacity:0}}
@keyframes slideUp{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes hpDrain{0%{transform:scaleX(1)}100%{transform:scaleX(0)}}

/* ===== 상단 HUD ===== */
.hud{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
.trophy-box{ display:flex; align-items:center; gap:5px; background:linear-gradient(180deg,#FFD95C,#FF9E00);
  padding:6px 12px; border-radius:14px; border:3px solid rgba(0,0,0,.4); box-shadow:0 4px 0 rgba(0,0,0,.4);
  font-weight:900; color:#3A2000; font-size:15px; }
.gem-box{ display:flex; align-items:center; gap:5px; background:linear-gradient(180deg,#5CE0FF,#0090D8);
  padding:6px 12px; border-radius:14px; border:3px solid rgba(0,0,0,.4); box-shadow:0 4px 0 rgba(0,0,0,.4);
  font-weight:900; color:#00293D; font-size:15px; }
.rank-box{ margin-left:auto; background:linear-gradient(180deg,#C77DFF,#7B2CBF); padding:6px 12px;
  border-radius:14px; border:3px solid rgba(0,0,0,.4); box-shadow:0 4px 0 rgba(0,0,0,.4);
  font-weight:900; font-size:13px; }

/* ===== 타이틀 ===== */
.title-wrap{ text-align:center; margin:6px 0 18px; }
.title{ font-size:40px; font-weight:900; line-height:.95; letter-spacing:-1px;
  background:linear-gradient(180deg,#FFE873 20%,#FF8A00 90%); -webkit-background-clip:text;
  -webkit-text-fill-color:transparent; filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)); }
.title-sub{ font-size:12px; color:var(--yellow); font-weight:800; letter-spacing:3px; margin-top:4px; }

/* ===== 내 브롤러 카드 ===== */
.mybrawler{ background:linear-gradient(180deg,var(--navy2),var(--navy)); border-radius:20px; padding:16px;
  border:3px solid rgba(0,0,0,.45); box-shadow:0 6px 0 rgba(0,0,0,.45); margin-bottom:16px;
  display:flex; align-items:center; gap:14px; }
.avatar{ width:66px; height:66px; border-radius:18px; display:flex; align-items:center; justify-content:center;
  font-size:38px; border:3px solid rgba(0,0,0,.45); box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); animation:bob 2.6s ease-in-out infinite; }
.mb-name{ font-size:19px; font-weight:900; }
.mb-role{ font-size:11px; color:var(--yellow); font-weight:800; letter-spacing:1px; }
.xpbar{ height:12px; background:#0E1128; border-radius:8px; overflow:hidden; margin-top:8px; border:2px solid rgba(0,0,0,.4); }
.xpfill{ height:100%; background:linear-gradient(90deg,var(--green),var(--blue)); transition:width .6s; }
.xptxt{ font-size:10px; color:var(--sub); margin-top:4px; font-weight:700; }

/* ===== 이벤트(스테이지) 카드 ===== */
.sec-title{ font-size:14px; font-weight:900; color:var(--yellow); letter-spacing:1px; margin:18px 0 10px;
  display:flex; align-items:center; gap:6px; }
.events{ display:flex; flex-direction:column; gap:12px; }
.ev{ position:relative; border-radius:18px; padding:14px; display:flex; align-items:center; gap:13px;
  border:3px solid rgba(0,0,0,.45); box-shadow:0 5px 0 rgba(0,0,0,.45); width:100%; text-align:left; color:#fff;
  transition:transform .12s; }
.ev:not(:disabled):hover{ transform:translateY(-2px); }
.ev-ic{ width:52px; height:52px; border-radius:15px; background:rgba(0,0,0,.28); display:flex;
  align-items:center; justify-content:center; font-size:28px; flex-shrink:0; border:2px solid rgba(255,255,255,.2); }
.ev-tier{ font-size:10px; font-weight:900; letter-spacing:1.5px; opacity:.85; }
.ev-name{ font-size:17px; font-weight:900; margin-top:1px; }
.ev-meta{ font-size:11px; opacity:.8; font-weight:700; margin-top:3px; }
.ev-tr{ margin-left:auto; text-align:right; }
.ev-star{ font-size:15px; letter-spacing:-1px; }
.lockbadge{ position:absolute; inset:0; background:rgba(8,10,25,.72); border-radius:15px;
  display:flex; align-items:center; justify-content:center; font-size:26px; }

/* ===== 배틀 화면 ===== */
.btop{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.xbtn{ width:38px; height:38px; border-radius:12px; background:linear-gradient(180deg,#FF6B85,#D81E42);
  border:3px solid rgba(0,0,0,.45); box-shadow:0 4px 0 rgba(0,0,0,.45); color:#fff; font-size:16px; font-weight:900; }
.bprog{ flex:1; height:16px; background:#0E1128; border-radius:10px; overflow:hidden; border:3px solid rgba(0,0,0,.45); }
.bprogf{ height:100%; transition:width .45s; background:linear-gradient(90deg,#FFE873,#FF8A00); }
.lives{ font-size:17px; letter-spacing:-3px; }

.vs-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.fighter{ text-align:center; flex:1; }
.f-av{ width:54px; height:54px; margin:0 auto; border-radius:15px; display:flex; align-items:center;
  justify-content:center; font-size:30px; border:3px solid rgba(0,0,0,.45); box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); }
.f-hp{ height:9px; background:#0E1128; border-radius:6px; margin-top:6px; overflow:hidden; border:2px solid rgba(0,0,0,.4); }
.f-hpf{ height:100%; transition:width .5s; }
.f-name{ font-size:10px; font-weight:900; margin-top:4px; opacity:.9; }
.vs-txt{ font-size:20px; font-weight:900; color:var(--yellow); filter:drop-shadow(0 2px 0 rgba(0,0,0,.6)); }

.combo-tag{ text-align:center; font-weight:900; font-size:19px; color:var(--yellow);
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.6)); margin-bottom:8px; animation:pop .35s; }
.mode-chip{ display:inline-block; font-size:11px; font-weight:900; letter-spacing:1px;
  padding:5px 13px; border-radius:20px; border:2px solid rgba(0,0,0,.4); margin-bottom:14px; }
.mission{ background:linear-gradient(180deg,var(--navy2),var(--navy)); border-radius:18px; padding:18px 16px;
  border:3px solid rgba(0,0,0,.45); box-shadow:0 5px 0 rgba(0,0,0,.45); text-align:center; margin-bottom:16px; }
.mission-lbl{ font-size:10px; font-weight:900; color:var(--yellow); letter-spacing:2px; margin-bottom:8px; }
.mission-ko{ font-size:22px; font-weight:900; line-height:1.35; }

.hint{ text-align:center; font-size:12px; color:var(--sub); font-weight:700; margin-bottom:12px; }
.slot{ min-height:62px; background:rgba(8,10,25,.55); border-radius:16px; padding:11px; display:flex;
  flex-wrap:wrap; gap:7px; align-items:center; justify-content:center; margin-bottom:14px;
  border:3px dashed rgba(255,255,255,.18); }
.slot-ph{ color:rgba(255,255,255,.28); font-size:12px; font-weight:700; }
.pool{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; }
.wchip{ background:linear-gradient(180deg,#3A4180,#252B54); color:#fff; padding:11px 15px; border-radius:13px;
  font-size:16px; font-weight:900; border:3px solid rgba(0,0,0,.4); box-shadow:0 4px 0 rgba(0,0,0,.4); }
.wchip.on{ background:linear-gradient(180deg,#FFD95C,#FF9E00); color:#3A2000; }
.bigbtn{ width:100%; padding:16px; border-radius:18px; font-size:18px; font-weight:900; color:#3A2000;
  border:3px solid rgba(0,0,0,.45); box-shadow:0 6px 0 rgba(0,0,0,.45);
  background:linear-gradient(180deg,#FFD95C,#FF9E00); }
.bigbtn.blue{ background:linear-gradient(180deg,#5CE0FF,#0090D8); color:#00293D; }
.bigbtn.red{ background:linear-gradient(180deg,#FF6B85,#D81E42); color:#fff; animation:glow 1s infinite; }
.bigbtn.ghost{ background:linear-gradient(180deg,#3A4180,#252B54); color:#fff; margin-top:10px; box-shadow:0 5px 0 rgba(0,0,0,.45); }

.saycard{ background:linear-gradient(180deg,#2E3568,#1B1F3B); border-radius:20px; padding:22px; text-align:center;
  border:3px solid rgba(0,0,0,.45); box-shadow:0 6px 0 rgba(0,0,0,.45); margin-bottom:14px; animation:bob 3s ease-in-out infinite; }
.say-en{ font-size:22px; font-weight:900; margin-bottom:12px; line-height:1.3; }
.playbtn{ background:rgba(0,0,0,.35); color:#fff; padding:8px 18px; border-radius:20px; font-size:13px;
  font-weight:800; border:2px solid rgba(255,255,255,.2); }
.warn{ font-size:10px; color:var(--sub); text-align:center; margin-top:10px; font-weight:700; }
.fb{ margin-top:14px; padding:13px; border-radius:14px; font-size:13px; font-weight:900; text-align:center;
  border:3px solid rgba(0,0,0,.4); animation:shake .4s; }

/* ===== 보상 오버레이 ===== */
.ovl{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:60; pointer-events:none; }
.ovl-bg{ position:absolute; inset:0; background:radial-gradient(circle at 50% 45%, rgba(255,201,60,.22), rgba(8,10,25,.86) 70%); }
.rcard{ position:relative; text-align:center; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both; }
.rring{ position:absolute; top:44px; left:50%; width:130px; height:130px; margin-left:-65px;
  border:5px solid var(--yellow); border-radius:50%; animation:ring .75s ease-out both; }
.rface{ font-size:74px; filter:drop-shadow(0 6px 0 rgba(0,0,0,.5)); }
.rmsg{ font-size:26px; font-weight:900; margin-top:2px; filter:drop-shadow(0 3px 0 rgba(0,0,0,.6)); }
.rrewards{ display:flex; gap:10px; justify-content:center; margin-top:16px; }
.rpill{ display:flex; align-items:center; gap:6px; padding:9px 16px; border-radius:26px; font-weight:900;
  font-size:18px; border:3px solid rgba(0,0,0,.45); box-shadow:0 4px 0 rgba(0,0,0,.45); animation:slideUp .45s .12s both; }
.rp-tr{ background:linear-gradient(180deg,#FFD95C,#FF9E00); color:#3A2000; }
.rp-gem{ background:linear-gradient(180deg,#5CE0FF,#0090D8); color:#00293D; }
.coin{ position:absolute; font-size:28px; animation:coinUp 1s ease-out both; }
.cf{ position:absolute; top:0; width:10px; height:16px; border-radius:2px; animation:conf 1.3s linear both; }

/* ===== 결과 ===== */
.res{ text-align:center; padding-top:36px; }
.res-banner{ font-size:34px; font-weight:900; letter-spacing:-1px; margin:8px 0 4px;
  background:linear-gradient(180deg,#FFE873,#FF8A00); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.55)); }
.res-stars{ font-size:34px; letter-spacing:2px; margin:10px 0 22px; }
.res-grid{ display:flex; gap:10px; justify-content:center; margin-bottom:24px; }
.res-box{ background:linear-gradient(180deg,var(--navy2),var(--navy)); border-radius:16px; padding:14px 16px;
  min-width:92px; border:3px solid rgba(0,0,0,.45); box-shadow:0 5px 0 rgba(0,0,0,.45); }
.res-n{ font-size:23px; font-weight:900; color:var(--yellow); }
.res-l{ font-size:10px; color:var(--sub); font-weight:800; margin-top:3px; letter-spacing:1px; }
.newbrawler{ background:linear-gradient(180deg,#C77DFF,#7B2CBF); border-radius:18px; padding:14px;
  border:3px solid rgba(0,0,0,.45); box-shadow:0 5px 0 rgba(0,0,0,.45); margin-bottom:18px; animation:pop .5s; }
.nb-t{ font-size:11px; font-weight:900; letter-spacing:2px; opacity:.9; }
.nb-n{ font-size:20px; font-weight:900; margin-top:4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================================================================
   SPEAK BRAWL — 브롤스타즈 스타일 영어 스피킹 배틀
   문법 단계 = 배틀 이벤트 / 문장 완성 = 적 처치 / 보상 = 트로피·젬
   ================================================================ */

/* ---------- 브롤러(캐릭터) : 스테이지 클리어 시 해금 ---------- */
const BRAWLERS = [
  { id:"b1", name:"쉘리",   emoji:"🦊", color:"#FF8A00", tag:"스타터" },
  { id:"b2", name:"콜트",   emoji:"🤠", color:"#00C2FF", tag:"명사수" },
  { id:"b3", name:"불",     emoji:"🐻", color:"#FF3B5C", tag:"탱커" },
  { id:"b4", name:"제시",   emoji:"⚡", color:"#FFC93C", tag:"서포터" },
  { id:"b5", name:"레온",   emoji:"🦎", color:"#3DDC5C", tag:"암살자" },
  { id:"b6", name:"스파이크",emoji:"🌵", color:"#FF5FA2", tag:"전설" },
  { id:"b7", name:"크로우", emoji:"🦅", color:"#A64DFF", tag:"전설" },
  { id:"b8", name:"엠즈",   emoji:"👑", color:"#FFD95C", tag:"신화" },
];

/* ---------- 배틀 이벤트 = 문법 커리큘럼 (초등~고등) ----------
   sentences 배열을 채워 3800문장까지 확장. { en, ko, chunks } */
const EVENTS = [
  { id:"g1", tier:"초등", mode:"젬 그랩", grammar:"be동사 · 현재", icon:"💎", color:"#00C2FF", boss:"👾", bossName:"비봇",
    sentences:[
      {en:"I am a student.",ko:"나는 학생이다.",chunks:["I","am","a","student"]},
      {en:"She is my friend.",ko:"그녀는 내 친구다.",chunks:["She","is","my","friend"]},
      {en:"They are happy.",ko:"그들은 행복하다.",chunks:["They","are","happy"]},
      {en:"It is a big dog.",ko:"그것은 큰 개다.",chunks:["It","is","a","big","dog"]},
      {en:"We are ready.",ko:"우리는 준비됐다.",chunks:["We","are","ready"]},
    ]},
  { id:"g2", tier:"초등", mode:"브롤볼", grammar:"일반동사 · 현재", icon:"⚽", color:"#3DDC5C", boss:"🤖", bossName:"봇킹",
    sentences:[
      {en:"I like pizza.",ko:"나는 피자를 좋아한다.",chunks:["I","like","pizza"]},
      {en:"He plays soccer.",ko:"그는 축구를 한다.",chunks:["He","plays","soccer"]},
      {en:"We go to school.",ko:"우리는 학교에 간다.",chunks:["We","go","to","school"]},
      {en:"She reads books.",ko:"그녀는 책을 읽는다.",chunks:["She","reads","books"]},
      {en:"Birds fly high.",ko:"새들은 높이 난다.",chunks:["Birds","fly","high"]},
    ]},
  { id:"g3", tier:"중등", mode:"하이스트", grammar:"현재진행형", icon:"💰", color:"#FFC93C", boss:"👹", bossName:"러너",
    sentences:[
      {en:"I am eating lunch.",ko:"나는 점심을 먹고 있다.",chunks:["I","am","eating","lunch"]},
      {en:"She is running fast.",ko:"그녀는 빠르게 달리고 있다.",chunks:["She","is","running","fast"]},
      {en:"They are watching a movie.",ko:"그들은 영화를 보고 있다.",chunks:["They","are","watching","a","movie"]},
      {en:"We are learning English.",ko:"우리는 영어를 배우고 있다.",chunks:["We","are","learning","English"]},
    ]},
  { id:"g4", tier:"중등", mode:"바운티", grammar:"과거시제", icon:"⭐", color:"#FF5FA2", boss:"🐙", bossName:"타코",
    sentences:[
      {en:"I visited my grandmother.",ko:"나는 할머니를 찾아뵀다.",chunks:["I","visited","my","grandmother"]},
      {en:"He bought a new phone.",ko:"그는 새 휴대폰을 샀다.",chunks:["He","bought","a","new","phone"]},
      {en:"We went to the beach.",ko:"우리는 해변에 갔다.",chunks:["We","went","to","the","beach"]},
      {en:"She finished her homework.",ko:"그녀는 숙제를 끝냈다.",chunks:["She","finished","her","homework"]},
    ]},
  { id:"g5", tier:"중등", mode:"녹아웃", grammar:"미래 · will / be going to", icon:"💥", color:"#A64DFF", boss:"🦖", bossName:"렉스",
    sentences:[
      {en:"I will call you tomorrow.",ko:"내일 너에게 전화할게.",chunks:["I","will","call","you","tomorrow"]},
      {en:"She is going to travel.",ko:"그녀는 여행을 갈 것이다.",chunks:["She","is","going","to","travel"]},
      {en:"We will win the game.",ko:"우리는 그 경기를 이길 것이다.",chunks:["We","will","win","the","game"]},
    ]},
  { id:"g6", tier:"고등", mode:"쇼다운", grammar:"현재완료", icon:"🏝️", color:"#FF8A00", boss:"🐲", bossName:"드레이크",
    sentences:[
      {en:"I have finished my project.",ko:"나는 프로젝트를 끝냈다.",chunks:["I","have","finished","my","project"]},
      {en:"She has lived here for years.",ko:"그녀는 여기서 수년간 살았다.",chunks:["She","has","lived","here","for","years"]},
      {en:"They have never seen snow.",ko:"그들은 눈을 본 적이 없다.",chunks:["They","have","never","seen","snow"]},
    ]},
  { id:"g7", tier:"고등", mode:"핫존", grammar:"관계대명사", icon:"🔥", color:"#FF3B5C", boss:"👺", bossName:"모르티스",
    sentences:[
      {en:"This is the book that I love.",ko:"이것은 내가 사랑하는 책이다.",chunks:["This","is","the","book","that","I","love"]},
      {en:"The man who called was kind.",ko:"전화한 남자는 친절했다.",chunks:["The","man","who","called","was","kind"]},
      {en:"I know a place where we can rest.",ko:"우리가 쉴 수 있는 곳을 안다.",chunks:["I","know","a","place","where","we","can","rest"]},
    ]},
  { id:"g8", tier:"고등", mode:"보스 배틀", grammar:"가정법", icon:"👑", color:"#FFD95C", boss:"😈", bossName:"다크 로드",
    sentences:[
      {en:"If I were rich, I would help.",ko:"내가 부자라면 도울 텐데.",chunks:["If","I","were","rich","I","would","help"]},
      {en:"I wish I could fly.",ko:"날 수 있으면 좋겠다.",chunks:["I","wish","I","could","fly"]},
    ]},
];
const TOTAL_TARGET = 3800;

/* ---------- 랭크 ---------- */
const RANKS=[[0,"브론즈 I"],[60,"브론즈 III"],[150,"실버 II"],[280,"골드 I"],[450,"다이아 II"],[700,"신화"],[1000,"레전드"],[1500,"마스터"]];
const rankOf=t=>{ let r=RANKS[0][1]; RANKS.forEach(([n,l])=>{ if(t>=n) r=l; }); return r; };

/* ---------- 유틸 ---------- */
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>s.toLowerCase().replace(/[.,!?]/g,"").trim();
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const srOK=!!SR;
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
/* 간단 효과음 (WebAudio) */
function sfx(type){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const ctx=sfx.ctx||(sfx.ctx=new C());
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    const map={hit:[880,.08],win:[1320,.18],bad:[180,.22],tap:[520,.05]};
    const [f,d]=map[type]||map.tap;
    o.type= type==="bad"?"sawtooth":"square"; o.frequency.value=f;
    g.gain.setValueAtTime(.09,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);
    o.start(); o.stop(ctx.currentTime+d);
  }catch(e){}
}

/* ---------- 플레이어 상태 ---------- */
const P={ trophies:0, gems:0, xp:0, cleared:{}, brawler:0, unlocked:[0] };
const app=document.getElementById("app");

/* ================= 홈 (메인 로비) ================= */
function home(){
  app.innerHTML="";
  const me=BRAWLERS[P.brawler];

  const hud=el("div","hud");
  hud.appendChild(el("div","trophy-box",`🏆 ${P.trophies}`));
  hud.appendChild(el("div","gem-box",`💎 ${P.gems}`));
  hud.appendChild(el("div","rank-box",rankOf(P.trophies)));
  app.appendChild(hud);

  const tw=el("div","title-wrap");
  tw.appendChild(el("div","title","SPEAK<br>BRAWL"));
  tw.appendChild(el("div","title-sub","ENGLISH BATTLE ARENA"));
  app.appendChild(tw);

  // 내 브롤러
  const mb=el("div","mybrawler");
  const av=el("div","avatar",me.emoji);
  av.style.background=`linear-gradient(180deg,${me.color},${me.color}99)`;
  mb.appendChild(av);
  const info=el("div"); info.style.flex="1";
  info.appendChild(el("div","mb-role",me.tag.toUpperCase()));
  info.appendChild(el("div","mb-name",me.name));
  const xb=el("div","xpbar"); const xf=el("div","xpfill");
  xf.style.width=Math.min(100,(P.xp/TOTAL_TARGET)*100*8)+"%"; xb.appendChild(xf);
  info.appendChild(xb);
  info.appendChild(el("div","xptxt",`문장 파워 ${P.xp} / ${TOTAL_TARGET}`));
  mb.appendChild(info);
  app.appendChild(mb);

  // 브롤러 선택(해금된 것만)
  if(P.unlocked.length>1){
    app.appendChild(el("div","sec-title","🎭 내 브롤러"));
    const row=el("div"); row.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px";
    P.unlocked.forEach(bi=>{
      const b=BRAWLERS[bi];
      const btn=el("button",null,b.emoji);
      btn.style.cssText=`width:52px;height:52px;border-radius:15px;font-size:26px;border:3px solid ${bi===P.brawler?"#FFC93C":"rgba(0,0,0,.45)"};box-shadow:0 4px 0 rgba(0,0,0,.45);background:linear-gradient(180deg,${b.color},${b.color}99)`;
      btn.onclick=()=>{ sfx("tap"); P.brawler=bi; home(); };
      row.appendChild(btn);
    });
    app.appendChild(row);
  }

  app.appendChild(el("div","sec-title","⚔️ 배틀 이벤트"));
  const list=el("div","events");
  EVENTS.forEach((e,i)=>{
    const st=P.cleared[e.id]||0;
    const locked= i>0 && !P.cleared[EVENTS[i-1].id];
    const b=el("button","ev");
    b.style.background=`linear-gradient(180deg,${e.color},${e.color}AA)`;
    b.disabled=locked;
    const ic=el("div","ev-ic",e.icon); b.appendChild(ic);
    const mid=el("div"); mid.style.flex="1";
    mid.appendChild(el("div","ev-tier",`${e.tier} · ${e.mode}`));
    mid.appendChild(el("div","ev-name",e.grammar));
    mid.appendChild(el("div","ev-meta",`${e.boss} ${e.bossName} · ${e.sentences.length}스테이지`));
    b.appendChild(mid);
    const tr=el("div","ev-tr");
    tr.appendChild(el("div","ev-star","⭐".repeat(st)+"☆".repeat(3-st)));
    b.appendChild(tr);
    if(locked) b.appendChild(el("div","lockbadge","🔒"));
    else b.onclick=()=>{ sfx("tap"); battle(i); };
    list.appendChild(b);
  });
  app.appendChild(list);
}

/* ================= 배틀 ================= */
function battle(evIdx){
  const EV=EVENTS[evIdx];
  const rounds=shuffle(EV.sentences);
  const me=BRAWLERS[P.brawler];
  let idx=0, lives=3, combo=0, gotTr=0, gotGem=0, gotXp=0;
  const bossMax=rounds.length;
  let bossHp=bossMax;

  function finish(win){
    const stars= win ? (lives>=3?3:lives===2?2:1) : 0;
    P.trophies+=gotTr; P.gems+=gotGem; P.xp+=gotXp;
    const prev=P.cleared[EV.id]||0;
    let newB=null;
    if(win){
      P.cleared[EV.id]=Math.max(prev,stars);
      const bi=evIdx+1;
      if(bi<BRAWLERS.length && !P.unlocked.includes(bi)){ P.unlocked.push(bi); newB=BRAWLERS[bi]; }
    }
    result(evIdx,{stars,win,tr:gotTr,gem:gotGem,newB});
  }

  function draw(){
    const cur=rounds[idx];
    let order=[], pool=shuffle(cur.chunks);
    app.innerHTML="";

    const top=el("div","btop");
    const x=el("button","xbtn","✕"); x.onclick=home; top.appendChild(x);
    const pb=el("div","bprog"); const pf=el("div","bprogf");
    pf.style.width=(idx/rounds.length*100)+"%"; pb.appendChild(pf); top.appendChild(pb);
    top.appendChild(el("div","lives","❤️".repeat(lives)+"🖤".repeat(3-lives)));
    app.appendChild(top);

    // VS 라인 (나 vs 보스)
    const vs=el("div","vs-row");
    const f1=el("div","fighter");
    const a1=el("div","f-av",me.emoji); a1.style.background=`linear-gradient(180deg,${me.color},${me.color}99)`;
    f1.appendChild(a1);
    const h1=el("div","f-hp"); const h1f=el("div","f-hpf");
    h1f.style.cssText=`width:${lives/3*100}%;background:linear-gradient(90deg,#3DDC5C,#00C2FF)`;
    h1.appendChild(h1f); f1.appendChild(h1); f1.appendChild(el("div","f-name",me.name));
    vs.appendChild(f1);
    vs.appendChild(el("div","vs-txt","VS"));
    const f2=el("div","fighter");
    const a2=el("div","f-av",EV.boss); a2.style.background="linear-gradient(180deg,#FF6B85,#901028)";
    f2.appendChild(a2);
    const h2=el("div","f-hp"); const h2f=el("div","f-hpf");
    h2f.style.cssText=`width:${bossHp/bossMax*100}%;background:linear-gradient(90deg,#FF3B5C,#FF8A00)`;
    h2.appendChild(h2f); f2.appendChild(h2); f2.appendChild(el("div","f-name",EV.bossName));
    vs.appendChild(f2);
    app.appendChild(vs);

    if(combo>1) app.appendChild(el("div","combo-tag",`🔥 ${combo} KILL STREAK`));

    const chip=el("div","mode-chip",`${EV.icon} ${EV.mode}`);
    chip.style.background=EV.color; chip.style.color="#1B1F3B";
    const cw=el("div"); cw.style.textAlign="center"; cw.appendChild(chip); app.appendChild(cw);

    const mis=el("div","mission");
    mis.appendChild(el("div","mission-lbl","MISSION"));
    mis.appendChild(el("div","mission-ko",cur.ko));
    app.appendChild(mis);

    const body=el("div"); app.appendChild(body);
    const fbSlot=el("div"); app.appendChild(fbSlot);

    function bad(msg){
      combo=0; lives--; sfx("bad");
      fbSlot.innerHTML="";
      const f=el("div","fb","💢 "+msg);
      f.style.cssText+="background:linear-gradient(180deg,#FF6B85,#B01634);color:#fff";
      fbSlot.appendChild(f);
      if(lives<=0) setTimeout(()=>finish(false),1000);
    }

    /* --- STEP 1 : 단어 조합 --- */
    function step1(){
      body.innerHTML="";
      body.appendChild(el("div","hint","단어를 순서대로 눌러 공격을 조합하라!"));
      const slot=el("div","slot");
      if(!order.length) slot.appendChild(el("span","slot-ph","여기에 문장이 만들어져요"));
      order.forEach((w,i)=>{
        const c=el("button","wchip on",w);
        c.onclick=()=>{ sfx("tap"); order.splice(i,1); pool.push(w); step1(); };
        slot.appendChild(c);
      });
      body.appendChild(slot);
      const pd=el("div","pool");
      pool.forEach((w,i)=>{
        const c=el("button","wchip",w);
        c.onclick=()=>{ sfx("tap"); order.push(w); pool.splice(i,1); step1(); };
        pd.appendChild(c);
      });
      body.appendChild(pd);
      const ok=order.length===cur.chunks.length;
      const btn=el("button","bigbtn","⚔️ 공격!");
      btn.style.opacity=ok?1:.45; btn.disabled=!ok;
      btn.onclick=()=>{
        if(order.join(" ")===cur.chunks.join(" ")){ sfx("hit"); say(cur.en); step2(); }
        else bad("조합 실패! 어순을 다시 확인하라.");
      };
      body.appendChild(btn);
    }

    /* --- STEP 2 : 스피킹 필살기 --- */
    function step2(){
      body.innerHTML="";
      const sc=el("div","saycard");
      sc.appendChild(el("div","say-en",cur.en));
      const pbn=el("button","playbtn","🔊 다시 듣기"); pbn.onclick=()=>say(cur.en);
      sc.appendChild(pbn);
      body.appendChild(sc);
      body.appendChild(el("div","hint","🎤 큰 소리로 외쳐 필살기를 발동하라!"));
      const mic=el("button","bigbtn red","🎤 필살기 발동");
      mic.onclick=()=>listen(mic);
      body.appendChild(mic);
      if(!srOK) body.appendChild(el("div","warn","음성인식 미지원 브라우저 — Chrome 권장 (조합 성공 시 자동 통과)"));
    }

    function listen(mic){
      if(!srOK){ hit("조합 성공! 필살기 명중!"); return; }
      const r=new SR(); r.lang="en-US"; r.interimResults=false; r.maxAlternatives=3;
      mic.textContent="🎙️ 듣는 중..."; mic.disabled=true; mic.style.opacity=".8";
      r.onresult=e=>{
        const heard=[...e.results[0]].map(a=>a.transcript);
        const perfect=heard.some(h=>norm(h)===norm(cur.en));
        const close=heard.some(h=>{
          const a=norm(h).split(" "),b=norm(cur.en).split(" ");
          return b.filter(w=>a.includes(w)).length/b.length>=.7;
        });
        if(perfect) hit("완벽한 명중!",1);
        else if(close) hit("살짝 빗나갔지만 명중!",.7);
        else { bad(`빗나감! 들린 발음: "${heard[0]||"..."}"`); if(lives>0) step2(); }
      };
      r.onerror=()=>{ fbSlot.innerHTML=""; const f=el("div","fb","🎙️ 마이크를 확인하라!"); f.style.cssText+="background:linear-gradient(180deg,#5CE0FF,#0090D8);color:#00293D"; fbSlot.appendChild(f); step2(); };
      try{ r.start(); }catch(e){}
    }

    /* --- 명중 = 보상 --- */
    function hit(msg,mult=1){
      combo++;
      bossHp=Math.max(0,bossHp-1);
      h2f.style.width=(bossHp/bossMax*100)+"%";
      const base=6+cur.chunks.length;
      const tr=Math.round(base*mult*(1+combo*.2));
      const gem=combo>=3?2:1;
      const xp=cur.chunks.length*10;
      gotTr+=tr; gotGem+=gem; gotXp+=xp;
      sfx("win");
      const last=idx+1>=rounds.length;
      reward({tr,gem,combo,perfect:mult>=1,msg,boss:last},()=>{
        if(last) finish(true); else { idx++; draw(); }
      });
    }
    step1();
  }
  draw();
}

/* ================= 보상 오버레이 ================= */
function reward(o,done){
  const ov=el("div","ovl");
  ov.appendChild(el("div","ovl-bg"));
  const card=el("div","rcard");
  card.appendChild(el("div","rring"));
  const face= o.boss?"👑" : o.combo>=3?"💥" : o.perfect?"🎯":"👊";
  card.appendChild(el("div","rface",face));
  const msg= o.boss?"보스 격파!" : o.combo>=3?`${o.combo} KILL STREAK!` : o.perfect?"완벽 명중!":"명중!";
  const rm=el("div","rmsg",msg);
  rm.style.color= o.combo>=3?"#FFC93C":"#fff";
  card.appendChild(rm);
  const rr=el("div","rrewards");
  rr.appendChild(el("div","rpill rp-tr",`🏆 +${o.tr}`));
  rr.appendChild(el("div","rpill rp-gem",`💎 +${o.gem}`));
  card.appendChild(rr);
  ov.appendChild(card);

  for(let i=0;i<7;i++){
    const c=el("div","coin",i%2?"🏆":"💎");
    c.style.left=(34+Math.random()*32)+"%"; c.style.top="52%";
    c.style.animationDelay=(i*.07)+"s"; ov.appendChild(c);
  }
  if(o.combo>=3||o.boss){
    const cols=["#FFC93C","#FF8A00","#FF3B5C","#00C2FF","#A64DFF","#3DDC5C"];
    for(let i=0;i<24;i++){
      const f=el("div","cf");
      f.style.left=Math.random()*100+"%";
      f.style.background=cols[i%cols.length];
      f.style.animationDelay=(Math.random()*.4)+"s"; ov.appendChild(f);
    }
  }
  app.appendChild(ov);
  const hold=(o.combo>=3||o.boss)?1700:1250;
  setTimeout(()=>{ ov.style.transition="opacity .3s"; ov.style.opacity="0"; },hold-300);
  setTimeout(()=>{ ov.remove(); done(); },hold);
}

/* ================= 결과 ================= */
function result(evIdx,r){
  app.innerHTML="";
  const w=el("div","res");
  const face=el("div",null,r.win?"🏆":"💀");
  face.style.cssText="font-size:70px;animation:pop .5s";
  w.appendChild(face);
  w.appendChild(el("div","res-banner",r.win?"VICTORY!":"DEFEAT"));
  w.appendChild(el("div","res-stars","⭐".repeat(r.stars)+"☆".repeat(3-r.stars)));

  const g=el("div","res-grid");
  g.appendChild(el("div","res-box",`<div class="res-n">🏆 ${P.trophies}</div><div class="res-l">트로피</div>`));
  g.appendChild(el("div","res-box",`<div class="res-n">💎 ${P.gems}</div><div class="res-l">젬</div>`));
  g.appendChild(el("div","res-box",`<div class="res-n">${rankOf(P.trophies)}</div><div class="res-l">랭크</div>`));
  w.appendChild(g);

  if(r.newB){
    const nb=el("div","newbrawler");
    nb.appendChild(el("div","nb-t","🎁 새로운 브롤러 해금!"));
    nb.appendChild(el("div","nb-n",`${r.newB.emoji} ${r.newB.name}`));
    w.appendChild(nb);
  }

  const b1=el("button","bigbtn","🏠 로비로"); b1.onclick=home; w.appendChild(b1);
  const b2=el("button","bigbtn ghost","🔁 재도전"); b2.onclick=()=>battle(evIdx); w.appendChild(b2);
  app.appendChild(w);
}

home();
</script>
