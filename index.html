<style>
  :root{
    --bg:#faf9f6; --surface:#ffffff; --line:#e8e6df; --line-strong:#d8d5cc;
    --ink:#2b2a26; --muted:#86847c; --hint:#a6a39a;
    --accent:#b07b54; --accent-soft:#f1e7dd; --accent-ink:#6e4a2d;
    --ok:#2f7d5b; --ok-soft:#e3f2ea; --danger:#b3493f; --danger-soft:#f6e6e3;
    --warn:#8a6d1f; --warn-soft:#f7efd8;
    --radius:14px; --shadow:0 1px 2px rgba(40,38,32,.04),0 8px 24px rgba(40,38,32,.06);
    --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;font-size:14px}

  .app{display:flex;flex-direction:column;min-height:100vh}
  header.topbar{position:sticky;top:0;z-index:30;background:rgba(250,249,246,.86);backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1320px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
  .brand h1{font-size:16px;font-weight:700;letter-spacing:-.2px}
  .brand .sub{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}

  .search-wrap{flex:1;min-width:200px;position:relative;display:flex;align-items:center}
  .search-wrap svg{position:absolute;left:13px;width:17px;height:17px;color:var(--hint);pointer-events:none}
  .search-wrap input{width:100%;height:42px;padding:0 38px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface);outline:none;font-size:14.5px;transition:.15s}
  .search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-clear{position:absolute;right:8px;width:24px;height:24px;border-radius:6px;display:none;place-items:center;color:var(--muted)}
  .search-clear:hover{background:var(--line)}
  .search-clear.show{display:grid}

  .top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .btn{height:40px;padding:0 15px;border-radius:10px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s;border:1px solid transparent;white-space:nowrap}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.primary:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn.icon{width:40px;padding:0;justify-content:center}

  .statusbar{max-width:1320px;margin:0 auto;padding:0 22px}
  .status{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:8px 12px;border-radius:9px;margin-top:10px}
  .status svg{width:15px;height:15px;flex-shrink:0}
  .status.ok{background:var(--ok-soft);color:#215c42}
  .status.warn{background:var(--warn-soft);color:var(--warn)}
  .status b{font-weight:700}
  .status .mini{margin-left:auto;font-size:12px;text-decoration:underline;cursor:pointer;opacity:.85}

  main{flex:1;max-width:1320px;width:100%;margin:0 auto;padding:16px 22px 80px;display:grid;grid-template-columns:230px 1fr;gap:26px}
  main.nofolders{grid-template-columns:1fr}
  aside{position:sticky;top:88px;align-self:start;max-height:calc(100vh - 108px);overflow:auto}
  .side-h{font-size:11.5px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.8px;padding:4px 10px 8px}
  .folder{width:100%;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-size:14px;color:var(--ink);text-align:left;transition:.12s;margin-bottom:1px}
  .folder:hover{background:var(--surface)}
  .folder.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .folder .ico{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
  .folder.active .ico{color:var(--accent)}
  .folder .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .folder .ct{font-size:11.5px;color:var(--hint);background:var(--bg);padding:1px 8px;border-radius:999px}
  .folder.active .ct{background:#fff}

  /* ===== 순서 편집 ===== */
  .side-h .ordbtn{float:right;font-size:11px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 9px;cursor:pointer}
  .side-h .ordbtn.on{background:var(--accent);color:#fff}
  .folder.reord{cursor:grab;background:var(--surface);border:1px dashed var(--line-strong)}
  .folder.reord:active{cursor:grabbing}
  .folder .grip{width:14px;height:14px;flex-shrink:0;color:var(--hint)}

  mark{background:#fbe6c8;color:var(--accent-ink);border-radius:3px;padding:0 1px}

  @media(max-width:840px){
    main{grid-template-columns:1fr}

</style>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        <strong>이미지 파일 선택 또는 끌어다 놓기</strong>
        <span class="small">png · jpg · gif 등 · 여러 장 가능</span>

          <div class="desc">저장 폴더 안에 이 이름의 하위 폴더로 저장됩니다.</div>
        </div>

          <input type="checkbox" id="fInternal"/>
          <span>
            <span class="t">내부공유용으로 표시</span>
            <span class="d">고객에게 보내면 안 되는 내부 자료에 체크하세요. 목록에 빨간 <b>내부공유용</b> 표시가 붙고, 지금 올리는 사진 전체에 함께 적용됩니다. (등록 후에도 언제든 바꿀 수 있어요)</span>
          </span>

        <div class="field">
          <label>원본 경로 (출처 기록용, 선택)</label>
          <textarea id="fPath" placeholder="C:\Users\user\OneDrive\...\디아망벽지샘플28-1.png"></textarea>
        </div>
        <div id="previewArea"></div>

      <button id="lbPath"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>경로 복사</button>
      <button id="lbClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>닫기</button>

  <div class="lb-body" id="lbBody"><img id="lbImg" src="" alt=""/></div>
  <div class="lb-hint">사진을 클릭하면 원래 크기로 확대 · 한 번 더 클릭하면 전체 보기</div>

<div class="selbar" id="selbar">
  <span id="selCount">0장 선택</span>

  <div class="modal" style="max-width:470px">

    </div>

<div class="toast" id="toast"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

const HAS_FSA='showDirectoryPicker' in window;
const SECURE=window.isSecureContext;
const LIB_FILE='_library.json';

/* ===== IndexedDB: 폴더 핸들 저장 ===== */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('arteFolderDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('h','readwrite');tx.objectStore('h').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const rq=db.transaction('h','readonly').objectStore('h').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})}

/* ===== 상태 ===== */
let dirHandle=null;
let items=[];          // {id,name,folder,path,file,thumb,ts,internal}
let activeFolder='__all__';
let searchTerm='', density='cozy';
let intFilter='all';   // all | pub(고객용) | int(내부공유용)
let folderOrder=[];    // 사용자가 정한 폴더 표시 순서
let reorder=false;     // 순서 편집 모드
let selectMode=false;  // 선택 모드
let sel=new Set();     // 선택된 이미지 id
let mode = (HAS_FSA && SECURE) ? 'fsa' : 'file'; // fsa: 폴더직접저장 / file: 파일내보내기 폴백
const IMG_RE=/\.(jpe?g|jpe|jfif|png|gif|webp|bmp|dib|avif|svg|heic|heif|tiff?|ico)$/i;
function isImage(f){const n=(f.name||'').trim();return IMG_RE.test(n)||(f.type&&f.type.toLowerCase().startsWith('image/'))}

let toastTimer;
function toast(msg,ok=true){const t=$('#toast');t.innerHTML=(ok?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>':'')+`<span>${msg}</span>`;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'i_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function lb(on,w){const b=$('#loadbar');if(on){b.classList.add('on');b.style.width=(w||10)+'%'}else{b.style.width='100%';setTimeout(()=>{b.classList.remove('on');b.style.width='0'},260)}}

/* ===== 썸네일 ===== */
function makeThumb(file,maxSide=480,q=0.8){return new Promise(res=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,maxSide/Math.max(w,h));const cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);URL.revokeObjectURL(url);let d='';try{d=c.toDataURL('image/jpeg',q)}catch(e){}res(d)};img.onerror=()=>{URL.revokeObjectURL(url);res('')};img.src=url})}

/* ===== 폴더 연결 (FSA 모드) ===== */
async function pickFolder(){
  try{
    const h=await window.showDirectoryPicker({id:'arte-cs-archive',mode:'readwrite'});
    dirHandle=h;
    await idbSet('dir',h);
    await ensurePermission(h,true);
    await loadLibrary();
    toast('저장 폴더를 연결했어요');
  }catch(e){ if(e&&e.name==='AbortError')return; toast('폴더 연결 실패: '+(e.message||e),false); }
}
async function ensurePermission(h,ask){
  if(!h.queryPermission)return true;
  let p=await h.queryPermission({mode:'readwrite'});
  if(p==='granted')return true;
  if(ask){p=await h.requestPermission({mode:'readwrite'})}
  return p==='granted';
}
async function reopenSaved(userGesture){
  const h=await idbGet('dir').catch(()=>null);
  if(!h)return false;
  dirHandle=h;
  const ok=await ensurePermission(h,userGesture);
  if(!ok){renderNeedPermission();return false;}
  await loadLibrary();
  return true;
}

/* 저장 폴더에서 _library.json + 실제 파일 로드 */
async function loadLibrary(){
  if(!dirHandle)return;
  lb(true,20);
  items=[];
  let meta=[];
  try{
    const fh=await dirHandle.getFileHandle(LIB_FILE);
    const f=await fh.getFile();
    const j=JSON.parse(await f.text());
    meta=(j&&j.items)||[];
    folderOrder=Array.isArray(j&&j.folderOrder)?j.folderOrder.slice():[];
  }catch(e){ meta=[]; folderOrder=[]; } // 최초엔 없음
  // 각 항목의 실제 파일을 읽어 File 확보 (썸네일은 메타에 저장돼 즉시 표시)
  for(const m of meta){
    items.push({id:m.id,name:m.name,folder:m.folder||'미분류',path:m.path||'',thumb:m.thumb||'',rel:m.rel||'',ts:m.ts||Date.now(),internal:!!m.internal,file:null});
  }
  lb(false);
  activeFolder='__all__';
  updateStatus();render();
  toast(`${items.length}장 불러왔어요`);
}

/* _library.json 저장 */
async function saveLibrary(){
  if(mode!=='fsa'||!dirHandle)return;
  const data={format:'arte-cs-archive',version:2,updatedAt:new Date().toISOString(),
    folderOrder:folderOrder.slice(),
    items:items.map(m=>({id:m.id,name:m.name,folder:m.folder,path:m.path||'',thumb:m.thumb||'',rel:m.rel||'',ts:m.ts,internal:!!m.internal}))};
  const fh=await dirHandle.getFileHandle(LIB_FILE,{create:true});
  const w=await fh.createWritable();
  await w.write(new Blob([JSON.stringify(data)],{type:'application/json'}));
  await w.close();
}

/* 폴더 핸들 얻기(하위폴더 생성) */
async function getFolderHandle(folder){
  if(!folder||folder==='미분류')return dirHandle;
  return await dirHandle.getDirectoryHandle(folder,{create:true});
}
/* 실제 파일 저장 */
async function writeImageFile(folder,filename,file){
  const fh=await getFolderHandle(folder);
  let name=filename, base=filename.replace(/(\.[^.]+)$/,''), ext=(filename.match(/\.[^.]+$/)||[''])[0], n=1;
  // 중복 이름 회피
  while(true){
    try{ await fh.getFileHandle(name); name=base+'('+(n++)+')'+ext; }
    catch(_){ break; }
  }
  const wh=await fh.getFileHandle(name,{create:true});
  const w=await wh.createWritable();
  await w.write(file);
  await w.close();
  return (folder&&folder!=='미분류'?folder+'/':'')+name;
}
/* 실제 파일 읽기(복사/확대용) */
async function readImageFile(it){
  if(it.file)return it.file;
  if(mode!=='fsa'||!dirHandle||!it.rel)return null;
  try{
    const parts=it.rel.split('/');
    let dir=dirHandle;
    for(let i=0;i<parts.length-1;i++)dir=await dir.getDirectoryHandle(parts[i]);
    const fh=await dir.getFileHandle(parts[parts.length-1]);
    const f=await fh.getFile();
    it.file=f;return f;
  }catch(e){return null}
}

/* ===== 등록 ===== */
let pending=[];
$('#addBtn').onclick=()=>{ if(!dirHandle && mode==='fsa'){toast('먼저 저장 폴더를 연결하세요',false);pickFolder();return;} openAdd(); };
function openAdd(){pending=[];$('#fFolder').value=activeFolder==='__all__'?'':activeFolder;$('#fPath').value='';$('#fInternal').checked=(intFilter==='int');$('#chkRow').classList.toggle('on',$('#fInternal').checked);$('#addFields').style.display='none';$('#previewArea').innerHTML='';$('#saveAdd').disabled=true;$('#addOverlay').classList.add('show')}
$('#fInternal').onchange=()=>$('#chkRow').classList.toggle('on',$('#fInternal').checked);
const dz=$('#dropzone');
dz.onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=e=>{stage([...e.target.files]);e.target.value=''};
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));
dz.addEventListener('drop',e=>{const fs=[...(e.dataTransfer.files||[])].filter(isImage);if(fs.length)stage(fs)});

async function stage(files){
  const imgs=files.filter(isImage);
  if(!imgs.length){toast('이미지 파일이 아니에요',false);return;}
  lb(true,20);pending=[];
  for(let i=0;i<imgs.length;i++){const f=imgs[i];const thumb=await makeThumb(f);pending.push({file:f,thumb});$('#loadbar').style.width=(20+70*(i+1)/imgs.length)+'%';}
  lb(false);
  $('#addFields').style.display='';$('#saveAdd').disabled=false;
  if(pending.length===1){const p=pending[0];$('#previewArea').innerHTML=`<div class="preview-row"><img src="${p.thumb||''}"/><div class="pmeta"><b>${esc(p.file.name)}</b>${(p.file.size/1024).toFixed(0)}KB</div></div>`}
  else $('#previewArea').innerHTML=`<div class="note" style="margin-bottom:0">${pending.length}장 준비됨 · 같은 폴더로 저장됩니다 (경로는 생략)</div>`;
}

$('#saveAdd').onclick=async()=>{
  if(!pending.length)return;
  const folder=($('#fFolder').value.trim())||'미분류';
  const path=$('#fPath').value.trim();
  const internal=$('#fInternal').checked;
  $('#saveAdd').disabled=true;lb(true,15);
  let ok=0;
  for(let i=0;i<pending.length;i++){
    const {file,thumb}=pending[i];
    const it={id:uid(),name:file.name,folder,path:(pending.length===1?path:''),thumb:thumb||'',rel:'',ts:Date.now(),internal,file};
    try{
      if(mode==='fsa'&&dirHandle){ it.rel=await writeImageFile(folder,file.name,file); }
      items.unshift(it);ok++;
    }catch(e){ toast('저장 실패: '+(e.message||e),false); }
    $('#loadbar').style.width=(15+80*(i+1)/pending.length)+'%';
  }
  try{ await saveLibrary(); }catch(e){ toast('목록 저장 실패: '+(e.message||e),false); }
  lb(false);
  $('#addOverlay').classList.remove('show');
  if(folder!=='미분류')activeFolder=folder;
  reorder=false;syncFolderOrder();
  try{ await saveCache(); }catch(_){}
  render();updateStatus();
  toast(internal?`${ok}장 저장 완료 · 내부공유용으로 표시했어요`:`${ok}장 저장 완료 · OneDrive가 자동 동기화합니다`);
};

/* ===== 폴더/목록 ===== */
function folderCounts(){const m={};items.forEach(p=>m[p.folder]=(m[p.folder]||0)+1);return m}
function folderNames(){return Object.keys(folderCounts())}

/* ===== 순서(폴더·이미지) ===== */
/* 폴더 순서 배열을 실제 폴더 목록과 동기화 (새 폴더는 뒤에 이름순으로 추가) */
function syncFolderOrder(){
  const names=folderNames();
  folderOrder=folderOrder.filter(n=>names.includes(n));
  const missing=names.filter(n=>folderOrder.indexOf(n)<0).sort((a,b)=>a.localeCompare(b,'ko'));
  if(missing.length)folderOrder=folderOrder.concat(missing);
  return folderOrder;
}
let orderSaveTimer=null;
function persistOrder(msg){
  clearTimeout(orderSaveTimer);
  orderSaveTimer=setTimeout(async()=>{
    try{ await saveLibrary(); }catch(e){ toast('순서 저장 실패: '+(e.message||e),false); }
    await saveCache();
  },500);
  if(msg)toast(msg);
}
function toggleReorder(on){
  reorder=(on===undefined)?!reorder:!!on;
  if(reorder){selectMode=false;sel.clear()}
  if(reorder&&searchTerm){$('#search').value='';searchTerm='';$('#searchClear').classList.remove('show')}
  render();
  if(!reorder)persistOrder('순서를 저장했어요');
}
/* 폴더 이동 */
function moveFolder(name,dir){
  const o=syncFolderOrder();const i=o.indexOf(name),j=i+dir;
  if(i<0||j<0||j>=o.length)return;
  o.splice(j,0,o.splice(i,1)[0]);
  render();persistOrder();
}
function dropFolder(src,dst){
  if(!src||src===dst)return;
  const o=syncFolderOrder();const si=o.indexOf(src),di=o.indexOf(dst);
  if(si<0||di<0)return;
  o.splice(si,1);
  o.splice(o.indexOf(dst)+(si<di?1:0),0,src);
  render();persistOrder();
}
/* 이미지 이동 (items 배열 순서 = 화면 표시 순서) */
function dropItem(srcId,dstId){
  if(!srcId||srcId===dstId)return;
  const si=items.findIndex(x=>x.id===srcId),di=items.findIndex(x=>x.id===dstId);
  if(si<0||di<0)return;
  const [it]=items.splice(si,1);
  items.splice(items.findIndex(x=>x.id===dstId)+(si<di?1:0),0,it);
  render();persistOrder();
}
function moveItem(id,dir){
  const list=currentList();
  const i=list.findIndex(x=>x.id===id),j=i+dir;
  if(i<0||j<0||j>=list.length)return;
  dropItem(id,list[j].id);
}
/* 자동 정렬 */
function sortFoldersByName(){
  folderOrder=folderNames().sort((a,b)=>a.localeCompare(b,'ko'));
  render();persistOrder('폴더를 이름순으로 정렬했어요');
}
function sortItemsInView(cmp,msg){
  const view=activeFolder==='__all__'?items.slice():items.filter(p=>p.folder===activeFolder);
  if(view.length<2)return;
  const set=new Set(view.map(p=>p.id));
  const pos=[];items.forEach((p,i)=>{if(set.has(p.id))pos.push(i)});
  const sorted=view.slice().sort(cmp);
  pos.forEach((p,k)=>items[p]=sorted[k]);
  render();persistOrder(msg);
}

function renderFolders(){
  const counts=folderCounts();const names=syncFolderOrder();
  const el=$('#folders');el.style.display='';document.querySelector('main').classList.remove('nofolders');
  let html=`<div class="side-h">폴더 (${names.length})<span class="ordbtn ${reorder?'on':''}" id="ordToggle">${reorder?'순서 완료':'순서 변경'}</span></div>`;
  html+=fBtn('__all__','전체 보기',items.length,'all',0,0);
  names.forEach((n,i)=>html+=fBtn(n,n,counts[n],'',i,names.length));
  el.innerHTML=html;
  const tg=$('#ordToggle');if(tg)tg.onclick=()=>toggleReorder();
  $$('.folder',el).forEach(b=>{
    const f=b.dataset.f;
    if(reorder&&f!=='__all__'){
      b.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain','F:'+f);e.dataTransfer.effectAllowed='move';b.classList.add('dragging')});
      b.addEventListener('dragend',()=>{b.classList.remove('dragging');$$('.folder',el).forEach(x=>x.classList.remove('dropline'))});
      b.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';b.classList.add('dropline')});
      b.addEventListener('dragleave',()=>b.classList.remove('dropline'));
      b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('dropline');const d=e.dataTransfer.getData('text/plain')||'';if(d.slice(0,2)==='F:')dropFolder(d.slice(2),f)});
      $$('.arw',b).forEach(a=>a.onclick=ev=>{ev.stopPropagation();if(a.dataset.d==='ren')askRenameFolder(f);else moveFolder(f,a.dataset.d==='up'?-1:1)});
      b.addEventListener('click',ev=>{if(ev.target.closest('.arw'))return;activeFolder=f;render()});
    }else{
      b.onclick=()=>{activeFolder=f;render()};
    }
  });
}
const ICO_ALL='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';

/* ===== 불러온 목록 캐시 (폴더 미연결 시에도 유지) ===== */
async function saveCache(){
  try{
    const data={savedAt:Date.now(),folderOrder:folderOrder.slice(),
      items:items.map(m=>({id:m.id,name:m.name,folder:m.folder,
      path:m.path||'',thumb:m.thumb||'',rel:m.rel||'',ts:m.ts,internal:!!m.internal}))};
    await idbSet('cache',data);
  }catch(_){}
}
async function loadCache(){
  try{
    const d=await idbGet('cache');
    if(!d||!d.items||!d.items.length)return false;
    items=d.items.map(m=>({...m,internal:!!m.internal,file:null}));
    if(Array.isArray(d.folderOrder))folderOrder=d.folderOrder.slice();
    return true;
  }catch(_){return false}
}

/* ===== 저장 지속성 진단 ===== */
let storageWarn=false;
async function checkPersistence(){
  try{
    // 샌드박스/미리보기 창은 저장소가 매번 초기화됨 → 표식으로 확인
    const mark=await idbGet('persistCheck');
    if(!mark)await idbSet('persistCheck',{t:Date.now()});
    // 저장소 자체가 막힌 경우
    if(!window.indexedDB){storageWarn=true;return;}
    // iframe(미리보기) 안에서 실행 중인지
    if(window.self!==window.top)storageWarn=true;
  }catch(_){storageWarn=true}
}

function updateStatus(){
  const el=$('#statusRow');
  if(storageWarn){
    el.innerHTML=`<div class="status warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg><span><b>주의:</b> 미리보기 창에서 열려 있어 저장이 유지되지 않습니다. 자료가 매번 사라진다면 이 창을 닫고 <b>엣지 브라우저에서 직접</b> 여세요.</span></div>`;
    return;
  }
  if(mode!=='fsa'){
    el.innerHTML=`<div class="status warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg><span>이 환경은 폴더 직접 저장이 지원되지 않아 <b>파일 내보내기/불러오기</b> 방식으로 동작합니다. (엣지·크롬 + https 권장)</span></div>`;
    return;
  }
  if(!dirHandle){el.innerHTML='';return;}
  el.innerHTML=`<div class="status ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg><span>저장 폴더 연결됨 · 등록 시 <b>OneDrive 폴더에 자동 저장</b>됩니다</span><span class="mini" id="miReload">새로고침</span></div>`;
  const mr=$('#miReload');if(mr)mr.onclick=()=>loadLibrary();
}

async function getBlobFor(p){
  const f=await readImageFile(p);
  if(f)return f;
  if(p.thumb){const r=await fetch(p.thumb);return await r.blob()}
  return null;
}

  const done=()=>{if(btn){btn.classList.add('done');btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>복사됨';setTimeout(()=>{btn.classList.remove('done');btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>복사'},1600)}};
  try{
    const blob=await getBlobFor(p);
    if(!blob)throw new Error('이미지 데이터 없음');
    let out=blob;if(blob.type!=='image/png')out=await toPng(blob);
    if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'image/png':out})]);done();toast(p.internal?'내부공유용 이미지입니다 · 고객에게 보내지 않도록 주의하세요':'이미지 복사됨 · 채팅방에 Ctrl+V',!p.internal);return;}
    throw new Error('no-api');
  }catch(e){
    try{const blob=await getBlobFor(p);const url=URL.createObjectURL(blob);const ok=await copyViaExec(url);URL.revokeObjectURL(url);if(ok){done();toast(p.internal?'내부공유용 이미지입니다 · 고객에게 보내지 않도록 주의하세요':'이미지 복사됨 · 채팅방에 Ctrl+V',!p.internal);return}}catch(_){}
    openLightbox(p);toast('자동 복사가 막힌 환경이에요. 크게 열린 이미지를 우클릭→복사 하세요',false);
  }
}
function toPng(blob){return new Promise((res,rej)=>{const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('변환 실패')),'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('로드 실패'))};img.src=url})}
function copyViaExec(url){return new Promise(res=>{const img=new Image();img.onload=()=>{const h=document.createElement('div');h.contentEditable='true';h.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';h.appendChild(img);document.body.appendChild(h);const r=document.createRange();r.selectNode(img);const s=window.getSelection();s.removeAllRanges();s.addRange(r);let ok=false;try{ok=document.execCommand('copy')}catch(_){}s.removeAllRanges();h.remove();res(ok)};img.onerror=()=>res(false);img.src=url})}
async function copyPath(p){if(!p.path){toast('저장된 경로가 없어요',false);return}try{await navigator.clipboard.writeText(p.path);toast('원본 경로를 복사했어요')}catch(e){const ta=document.createElement('textarea');ta.value=p.path;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('원본 경로를 복사했어요')}catch(_){toast('경로 복사 실패',false)}ta.remove()}}

/* ===== 삭제 ===== */
function isMissingErr(e){
  const n=(e&&e.name)||'', m=(e&&e.message)||'';
  return n==='NotFoundError'||/could not be found|not be found|NotFound/i.test(m);
}
async function askDelete(p){
  if(!confirm(`"${p.name}" 이미지를 삭제할까요?\n저장 폴더에서도 파일이 삭제됩니다.`))return;
  let missing=false;
  try{
    if(mode==='fsa'&&dirHandle&&p.rel){
      const parts=p.rel.split('/');
      let dir=dirHandle;
      try{
        for(let i=0;i<parts.length-1;i++)dir=await dir.getDirectoryHandle(parts[i]);
        await dir.removeEntry(parts[parts.length-1]);
      }catch(e){
        if(!isMissingErr(e))throw e;
        missing=true;   // 저장 폴더에 파일이 이미 없음 → 목록에서만 정리
      }
    }
    items=items.filter(x=>x.id!==p.id);
    await saveLibrary();
    await saveCache();

    toast(missing?'저장 폴더에 파일이 없어 목록에서만 지웠어요':'삭제했어요');
  }catch(e){toast('삭제 실패: '+(e.message||e),false)}
}

/* ===== 이름 수정 (폴더/이미지) ===== */
const BAD_NAME=/[\\\/:*?"<>|]/;
function extOf(n){const m=(n||'').match(/\.[^.\/\\]+$/);return m?m[0]:''}
/* 같은 폴더 안에서 겹치지 않는 파일명 만들기 */
async function uniqueFileName(dir,name,skipName){
  const base=name.replace(/(\.[^.]+)$/,''), ext=extOf(name);
  let out=name,n=1;
  while(true){
    if(skipName&&out.toLowerCase()===skipName.toLowerCase())return out;
    try{ await dir.getFileHandle(out); out=base+'('+(n++)+')'+ext; }
    catch(_){ return out; }
  }
}
async function dirOfRel(rel){
  let dir=dirHandle;const parts=rel.split('/');
  for(let i=0;i<parts.length-1;i++)dir=await dir.getDirectoryHandle(parts[i]);
  return {dir,name:parts[parts.length-1],prefix:parts.slice(0,-1).join('/')};
}
/* 파일 이동/이름변경 (복사 후 원본 삭제) */
async function moveFile(srcDir,srcName,dstDir,wantName){
  const f=await (await srcDir.getFileHandle(srcName)).getFile();
  const same=(srcDir===dstDir);
  const fin=await uniqueFileName(dstDir,wantName,same?srcName:null);
  /* 같은 폴더에서 이름이 같으면(대소문자만 다른 경우 포함) 파일은 건드리지 않음 */
  if(same&&fin.toLowerCase()===srcName.toLowerCase())return srcName;
  const wh=await dstDir.getFileHandle(fin,{create:true});
  const w=await wh.createWritable();await w.write(f);await w.close();
  await srcDir.removeEntry(srcName);
  return fin;
}

/* --- 이미지 이름 수정 --- */
async function askRenameItem(p){
  const cur=p.name;
  let v=prompt('이미지 파일 이름을 바꿉니다.\n(확장자를 빼고 입력하면 원래 확장자가 유지됩니다)',cur);
  if(v==null)return;
  v=v.trim();
  if(!v||v===cur)return;
  if(BAD_NAME.test(v)){toast('이름에 \\ / : * ? " < > | 는 쓸 수 없어요',false);return}
  if(!extOf(v))v=v+extOf(cur);
  try{
    lb(true,30);
    if(mode==='fsa'&&dirHandle&&p.rel){
      const {dir,name,prefix}=await dirOfRel(p.rel);
      const fin=await moveFile(dir,name,dir,v);
      p.rel=(prefix?prefix+'/':'')+fin;
      p.name=fin;
    }else{
      p.name=v;
    }
    p.file=null;
    await saveLibrary();await saveCache();
    lb(false);render();toast('이미지 이름을 바꿨어요');
  }catch(e){lb(false);toast(isMissingErr(e)?'저장 폴더에 원본 파일이 없어 이름을 바꿀 수 없어요 (파일이 옮겨졌거나 삭제된 항목)':'이름 변경 실패: '+(e.message||e),false)}
}

  if(v==null)return;

  if(!v||v===oldF)return;
  if(BAD_NAME.test(v)){toast('폴더 이름에 \\ / : * ? " < > | 는 쓸 수 없어요',false);return}
  const exists=folderNames().indexOf(v)>=0;
  if(exists&&!confirm(`"${v}" 폴더가 이미 있습니다.\n두 폴더를 합칠까요?`))return;
  const list=items.filter(x=>x.folder===oldF);
  try{
    lb(true,10);
    if(mode==='fsa'&&dirHandle){
      const target=(v==='미분류')?dirHandle:await dirHandle.getDirectoryHandle(v,{create:true});
      for(let i=0;i<list.length;i++){
        const it=list[i];
        if(it.rel){
          try{

            it.rel=(v==='미분류'?'':v+'/')+fin;

          }catch(_){}

      }
      if(oldF!=='미분류'){try{await dirHandle.removeEntry(oldF,{recursive:false})}catch(_){}}
    }else{
      list.forEach(it=>it.folder=v);

    lb(false);render();updateStatus();

  }catch(e){lb(false);toast('폴더 이름 변경 실패: '+(e.message||e),false)}
}

async function moveSelectedTo(folder){
  const list=items.filter(x=>sel.has(x.id));
  if(!list.length)return;
  const from=[...new Set(list.map(x=>x.folder))];
  let moved=0,failed=0;
  try{
    lb(true,10);
    if(mode==='fsa'&&dirHandle){
      const target=(folder==='미분류')?dirHandle:await dirHandle.getDirectoryHandle(folder,{create:true});
      for(let i=0;i<list.length;i++){
        const it=list[i];
        if(it.folder!==folder&&it.rel){
          try{
            const {dir,name}=await dirOfRel(it.rel);
            const fin=await moveFile(dir,name,target,it.name);
            it.rel=(folder==='미분류'?'':folder+'/')+fin;
            it.name=fin;it.folder=folder;it.file=null;moved++;
          }catch(e){failed++}
        }else if(it.folder!==folder){ it.folder=folder;moved++; }
        $('#loadbar').style.width=(10+80*(i+1)/list.length)+'%';
      }
      /* 비게 된 원래 폴더 정리 */
      for(const f of from){
        if(f===folder||f==='미분류')continue;
        if(items.some(x=>x.folder===f))continue;
        try{await dirHandle.removeEntry(f,{recursive:false})}catch(_){}
      }
    }else{
      list.forEach(it=>{if(it.folder!==folder){it.folder=folder;moved++}});
    }
    sel.clear();syncFolderOrder();
    await saveLibrary();await saveCache();
    lb(false);render();updateStatus();
    toast(failed?`${moved}장 이동 · ${failed}장 실패(원본 파일 없음)`:`${moved}장을 "${folder}" 폴더로 옮겼어요`,!failed);
  }catch(e){lb(false);toast('이동 실패: '+(e.message||e),false)}
}

function blobToDataURL(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)})}
async function exportLibrary(includeFull){
  if(!items.length){toast('내보낼 이미지가 없어요',false);return;}
  const stamp=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const fname=`아르떼CS이미지목록_${stamp}${includeFull?'_원본포함':''}.json`;
  if(includeFull&&!confirm(`원본 사진까지 포함해 백업합니다.\n이미지 ${items.length}장 · 사진 용량만큼 파일이 커집니다(수 GB가 될 수 있어요).\n\n저장 위치를 묻는 창이 뜨면 위치를 고르세요.\n중간에 창을 닫지 마세요.\n\n계속할까요?`))return;

  /* 원본 포함 백업은 파일로 바로 흘려 쓴다(메모리에 다 쌓지 않음) */
  let handle=null,writer=null;
  if(includeFull&&window.showSaveFilePicker){
    try{
      handle=await showSaveFilePicker({suggestedName:fname,
        types:[{description:'목록 파일(JSON)',accept:{'application/json':['.json']}}]});
      writer=await handle.createWritable();
    }catch(e){ if(e&&e.name==='AbortError')return; handle=null;writer=null; }
  }
  if(includeFull&&!writer&&items.length>80&&!confirm('이 브라우저는 파일로 바로 저장하는 기능을 지원하지 않아, 사진을 모두 메모리에 담아야 합니다.\n장수가 많으면 브라우저가 멈출 수 있어요.\n\n그래도 계속할까요? (엣지·크롬 권장)'))return;

  lb(true,5);
  const parts=[];
  const put=async t=>{ if(writer)await writer.write(t); else parts.push(t); };
  const head={format:'arte-cs-archive',version:2,kind:includeFull?'full':'light',
    exportedAt:new Date().toISOString(),count:items.length,folderOrder:syncFolderOrder().slice()};
  let missing=0;
  try{
    await put(JSON.stringify(head).slice(0,-1)+',"items":[');
    for(let i=0;i<items.length;i++){
      const m=items[i];
      const rec={id:m.id,name:m.name,folder:m.folder,path:m.path||'',thumb:m.thumb||'',rel:m.rel||'',ts:m.ts,internal:!!m.internal};
      if(includeFull){
        try{
          const f=await readImageFile(m);
          if(f)rec.full=await blobToDataURL(f); else missing++;
        }catch(_){missing++}
        m.file=null;                       /* 원본 캐시를 바로 놓아준다 */
      }
      await put((i?',':'')+JSON.stringify(rec));
      rec.full=null;
      $('#loadbar').style.width=(5+90*(i+1)/items.length)+'%';
      if(includeFull&&(i%5===0||i===items.length-1))toast(`백업 중… ${i+1} / ${items.length}장`);
      if(i%20===0)await new Promise(r=>setTimeout(r,0));   /* 화면이 멈추지 않도록 숨 돌리기 */
    }
    await put(']}');
    let size=0;
    if(writer){ await writer.close(); try{size=(await handle.getFile()).size}catch(_){} }
    else{
      const blob=new Blob(parts,{type:'application/json'});size=blob.size;
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
      document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200);
    }
    lb(false);
    const mb=(size/1048576).toFixed(1);
    toast(missing?`백업 완료 (${mb}MB) · 원본을 찾지 못한 ${missing}장은 목록만 담겼어요`
                 :`백업 완료 (${mb}MB) · 안전한 곳에 보관하세요`);
  }catch(e){
    lb(false);
    try{ if(writer)await writer.abort(); }catch(_){}
    toast('백업 실패: '+((e&&e.message)||e)+' — 원본 포함 대신 "가볍게"로 저장해 보세요',false);
  }
}

/* ===== 목록 불러오기 (가볍게/원본 포함 모두 인식) ===== */
/* 큰 백업 파일도 통째로 메모리에 올리지 않고 한 장씩 흘려 읽는다 */
async function readExportStream(file,onHead,onItem){
  const reader=file.stream().getReader();
  const dec=new TextDecoder('utf-8');
  let buf='',head=false,depth=0,inStr=false,escp=false,st=-1,scan=0,n=0;
  while(true){
    const r=await reader.read();
    buf+=r.value?dec.decode(r.value,{stream:true}):(r.done?dec.decode():'');
    if(!head){
      const k=buf.indexOf('"items"');
      const br=k>=0?buf.indexOf('[',k):-1;
      if(br>=0){
        let h={};
        try{h=JSON.parse(buf.slice(0,k).replace(/[,\s]*$/,'')+'}')}catch(_){}
        await onHead(h);
        head=true;buf=buf.slice(br+1);scan=0;
      }
    }
    if(head){
      for(let i=scan;i<buf.length;i++){
        const c=buf[i];
        if(inStr){ if(escp)escp=false; else if(c==='\\')escp=true; else if(c==='"')inStr=false; continue; }
        if(c==='"'){inStr=true;continue}
        if(c==='{'){ if(depth===0)st=i; depth++; continue }
        if(c==='}'){
          depth--;
          if(depth===0&&st>=0){
            const txt=buf.slice(st,i+1);
            buf=buf.slice(i+1);st=-1;i=-1;scan=0;n++;
            await onItem(txt,n);
          }
        }
      }
      scan=buf.length;
    }
    if(r.done)break;
  }
  return n;
}

$('#importInput').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  let merge=true,existing=new Set(),total=0,kind='가벼운';
  let added=0,skipped=0,wrote=0,reused=0,failed=0;
  lb(true,6);
  try{
    const n=await readExportStream(file,
      h=>{
        kind=h.kind==='full'?'원본 포함':'가벼운';
        total=h.count||0;
        if(items.length){
          merge=confirm(`${kind} 목록 ${total||''}장을 불러옵니다.\n\n[확인] 기존 목록에 추가 (병합)\n[취소] 기존 목록을 지우고 교체`);
        }
        if(!merge){items=[];folderOrder=Array.isArray(h.folderOrder)?h.folderOrder.slice():[]}
        else if(Array.isArray(h.folderOrder))h.folderOrder.forEach(x=>{if(folderOrder.indexOf(x)<0)folderOrder.push(x)});
        existing=new Set(items.map(x=>x.id));
      },
      async (txt,idx)=>{
        let m=null;try{m=JSON.parse(txt)}catch(_){failed++;return}
        if(!m||(!m.name&&!m.rel&&!m.thumb))return;
        if(m.id&&existing.has(m.id)){skipped++;m=null;return}
        const it={id:m.id||uid(),name:m.name||'image',folder:m.folder||'미분류',
          path:m.path||'',thumb:m.thumb||'',rel:m.rel||'',ts:m.ts||Date.now(),internal:!!m.internal,file:null};
        if(m.full){
          if(mode==='fsa'&&dirHandle){
            /* 이미 저장 폴더에 있는 파일이면 다시 쓰지 않고 그대로 연결 */
            let ok=false;
            if(m.rel){
              try{const {dir,name}=await dirOfRel(m.rel);await dir.getFileHandle(name);it.rel=m.rel;it.name=name;ok=true;reused++}catch(_){}
            }
            if(!ok){
              try{
                const blob=dataURLtoBlob(m.full,it.name);
                const target=it.folder==='미분류'?dirHandle:await dirHandle.getDirectoryHandle(it.folder,{create:true});
                const fin=await uniqueFileName(target,it.name);
                const wh=await target.getFileHandle(fin,{create:true});
                const w=await wh.createWritable();await w.write(blob);await w.close();
                it.name=fin;it.rel=(it.folder==='미분류'?'':it.folder+'/')+fin;wrote++;
              }catch(_){failed++}
            }
          }else{
            try{it.file=dataURLtoBlob(m.full,it.name)}catch(_){}
          }
        }
        m=null;
        items.push(it);if(it.id)existing.add(it.id);added++;
        $('#loadbar').style.width=(6+88*(total?Math.min(1,idx/total):((idx%50)/50)))+'%';
        if(idx%5===0)toast(`불러오는 중… ${idx}${total?' / '+total:''}장`);
        if(idx%20===0)await new Promise(r=>setTimeout(r,0));
      });
    if(!n&&!added){lb(false);toast('올바른 목록 파일이 아니에요',false);return}
    syncFolderOrder();
    activeFolder='__all__';intFilter='all';reorder=false;selectMode=false;sel.clear();
    try{await saveLibrary()}catch(_){}
    await saveCache();
    lb(false);render();updateStatus();
    const bits=[`${added}장 불러왔어요`];
    if(wrote)bits.push(`${wrote}장 저장 폴더에 복원`);
    if(reused)bits.push(`${reused}장은 이미 있어 그대로 연결`);
    if(skipped)bits.push(`${skipped}장은 이미 목록에 있음`);
    if(failed)bits.push(`${failed}장 실패`);
    toast(bits.join(' · '),!failed);
  }catch(err){
    lb(false);render();
    toast('불러오기 실패: '+((err&&err.message)||err),false);
  }
};
function dataURLtoBlob(d,name){
  const [head,body]=d.split(',');
  const mime=(head.match(/:(.*?);/)||[])[1]||'image/png';
  const bin=atob(body);const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new File([arr],name||'image',{type:mime});
}

$('#search').addEventListener('input',e=>{searchTerm=e.target.value.trim();$('#searchClear').classList.toggle('show',!!searchTerm);if(searchTerm&&reorder){reorder=false;persistOrder()}if(items.length)render()});
$('#searchClear').onclick=()=>{$('#search').value='';searchTerm='';$('#searchClear').classList.remove('show');render();$('#search').focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#lightbox').classList.contains('show')){closeLightbox();return}if(selectMode){toggleSelect(false);return}$$('.overlay.show').forEach(o=>o.classList.remove('show'))}if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}});
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('show'));

(async function init(){
  $('#addBtn').disabled=false;
  await checkPersistence();
  updateStatus();
  if(mode==='fsa'){
    const restored=await reopenSaved(false);
    if(restored)return;
    if(dirHandle)return;           // 권한 대기 화면 표시 중
    const cached=await loadCache(); // 폴더 미연결이면 저장된 목록 복원
    if(cached){render();updateStatus();return;}
    renderWelcome();
  }else{
    const cached=await loadCache();
    if(cached){render();updateStatus();return;}
    renderFallback();
  }
})();
